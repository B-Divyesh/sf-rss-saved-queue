<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save to queue</title><style>body{width:330px;margin:0;padding:16px;background:#f5f0e7;color:#25231f;font:16px system-ui,sans-serif}h1{font:600 21px Georgia,serif;margin:0 0 12px}label{display:block;font-weight:700;font-size:13px;margin-top:10px}input{box-sizing:border-box;width:100%;min-height:38px;padding:7px;border:1px solid #25231f;background:#fffdf8;color:#25231f}button{width:100%;min-height:42px;margin-top:16px;border:0;background:#a83222;color:#fffaf3;font-weight:700}p{font-size:13px;line-height:1.4}.status{min-height:20px;color:#8d251b}</style></head><body><h1>Save to your queue</h1><form id="save"><label for="title">Title</label><input id="title" required maxlength="300"><label for="url">Page address</label><input id="url" type="url" required><label for="tags">Tags</label><input id="tags" placeholder="design, long read"><button>Save page</button></form><p class="status" id="status" role="status"></p><p>Configure the service URL and device key in the extension’s options page.</p><script src="popup.js"></script></body></html>
