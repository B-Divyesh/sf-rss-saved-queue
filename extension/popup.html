<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save a link — RSS Saved Queue</title><style>body{width:330px;margin:0;background:#f5f0e7;color:#25231f;font:16px system-ui,sans-serif}main{padding:16px}h1{font:600 22px Georgia,serif;margin:0 0 12px}label{display:block;font-weight:700;font-size:14px;margin-top:10px}input{box-sizing:border-box;width:100%;min-height:44px;padding:9px;border:1px solid #25231f;background:#fffdf8;color:#25231f}button{width:100%;min-height:44px;margin-top:16px;border:0;background:#a83222;color:#fffaf3;font-weight:700}button:focus-visible,input:focus-visible{outline:3px solid #075f68;outline-offset:2px}p{font-size:13px;line-height:1.4}.status{min-height:20px;color:#721c14;font-weight:700}</style></head><body><main><h1>Save a link to your queue</h1><form id="save"><label for="title">Link title</label><input id="title" required maxlength="300"><label for="url">Web link</label><input id="url" type="url" required><label for="tags">Tags</label><input id="tags" placeholder="design, long read"><button>Save link</button></form><p class="status" id="status" role="status"></p><p>Add the service URL and device key in the extension settings.</p></main><script src="popup.js"></script></body></html>
